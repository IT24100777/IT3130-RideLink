spring.application.name=account-service
server.port=${SERVER_PORT:8081}

# --- Database (own database for this service only - see assignment data-ownership rule) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ridelink_account}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# NEVER commit a real secret - set RIDELINK_JWT_SECRET as an environment variable.
# This value must be identical across all four services so they can verify each other's tokens.
ridelink.jwt.secret=${RIDELINK_JWT_SECRET:change-this-to-a-long-random-secret-before-running}
ridelink.jwt.expiration-minutes=${RIDELINK_JWT_EXPIRATION_MINUTES:60}

# --- OpenAPI / Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Actuator (for CI/health checks) ---
management.endpoints.web.exposure.include=health,info
