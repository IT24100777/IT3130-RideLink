spring.application.name=account-service
server.port=${SERVER_PORT:8081}

# --- Database (own database for this service only - see assignment data-ownership rule) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ridelink_account}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# NEVER commit a real secret - RIDELINK_JWT_SECRET must be set as an environment variable
# before running. There is deliberately no fallback default here: a predictable default
# would let anyone who has read this file forge a valid admin token. The app will fail to
# start if this is not set - that is intentional.
# This value must be identical across all four services so they can verify each other's tokens.
ridelink.jwt.secret=${RIDELINK_JWT_SECRET}
ridelink.jwt.expiration-minutes=${RIDELINK_JWT_EXPIRATION_MINUTES:60}

# --- OpenAPI / Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Actuator (for CI/health checks) ---
management.endpoints.web.exposure.include=health,info
